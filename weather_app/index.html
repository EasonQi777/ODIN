<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
</head>
<body>

  <button id="searchBtn">Get current template in your city</button>
  <div id="searchResult"></div>
  <script>
  const searchBtn = document.querySelector('#searchBtn');
  const searchResult = document.querySelector('#searchResult');

  function templateTransfer(temp) {
    return ((temp -32) * 5 / 9).toFixed(2);
  }
  
  async function dataSearch(city) {
    const response = await fetch(`https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${city}?key={key}`)
    const data = await response.json();
    return data;
  }

  async function getLocation() {
    return new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(async function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    
      const data2 = await response.json();
      resolve(data2);
    },
    function(error) {
      reject(error);
    });
    
  });
}

  async function showResult() {
    const data2 = await getLocation();
    const city = data2.city;
    console.log(city);
    const data = await dataSearch(city);
    const temp = await data.currentConditions.temp;
    const currentTemp = templateTransfer(temp);
    console.log(currentTemp);
    
    console.log(data);
    searchResult.innerHTML = '';
    searchResult.innerHTML = `
    <p>${currentTemp}</p>
    `;
  }

  searchBtn.addEventListener('click', showResult);

  </script>
</body>
</html>
