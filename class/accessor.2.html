<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
	
    <script>
        let user = {
		get name() {
			return this._name;
		},

		set name(value) {
			if (value.length < 4) {
				alert("Name is too short");
				return;
			}
			this._name = value;
		}
	};

	user.name = "Pete";
	alert(user.name);

	</script>
  </body>
</html>
