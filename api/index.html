  <script>

	async function getCats() {
	  const response = await fetch('https://api.giphy.com/v1/gifs/translate?api_key=2GGwfLQrTrjxzfWDDloTC6nqStE9MTbN&s=cats');

	const searchInput = document.querySelector("#searchInput");
	const searchBtn = document.querySelector("#searchBtn");
	const resultList = document.querySelector("#resultList");
	const API_KEY = "2GGwfLQrTrjxzfWDDloTC6nqStE9MTbN";

	function searchGifs() {
		const keyword = searchInput.value.trim();
		if (!keyword) {
			return;
		}

		resultList.innerHTML = "";

		fetch(
			`https://api.giphy.com/v1/gifs/search?api_key=${API_KEY}&q=${encodeURIComponent(keyword)}&limit=10`
		)
			.then(function(response) {
				if (!response.ok) {
					throw new Error(`Request failed: ${response.status} ${response.statusText}`);
				}
				return response.json();
			})
			.then(function(data) {
				if (!data.data || data.data.length === 0) {
					const li = document.createElement("li");
					li.textContent = "No GIFs found.";
					resultList.appendChild(li);
					return;
				}

				data.data.forEach(function(gif) {
					const li = document.createElement("li");
					const img = document.createElement("img");
					img.src = gif.images.original.url;
					img.alt = gif.title;
					li.appendChild(img);
					resultList.appendChild(li);
				});
			})
			.catch(function(error) {
				console.error("Error:", error);
				resultList.innerHTML = "";
				const li = document.createElement("li");
				li.textContent = "Something went wrong. Please check your connection and try again.";
				resultList.appendChild(li);
			});
	}

	searchBtn.addEventListener("click", searchGifs);

	searchInput.addEventListener("keydown", function(e) {
		if (e.key === "Enter") {
			searchGifs();
		}
	});
  </script>
</body>
